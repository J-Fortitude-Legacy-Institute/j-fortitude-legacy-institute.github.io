    <!-- GitHub Pages caches HTML for 600s but removes previous hashed bundles
         on deployment. A cached shell can otherwise become a permanently blank
         app, including the Media Engine publisher, when its JS URL returns 404.
         This tiny inline bootstrap runs BEFORE Vite's module script. -->
    <script id="jf-bundle-recovery">
      (() => {
        const retryKey = "__jf_bundle_retry";
        let recoveryStarted = false;

        window.addEventListener("error", (event) => {
          if (recoveryStarted) return;
          const element = event.target;
          const tag = String(element?.tagName ?? "").toUpperCase();
          if (tag !== "SCRIPT" && tag !== "LINK") return;
          const assetUrl = tag === "SCRIPT" ? element.src : element.href;
          if (typeof assetUrl !== "string" || !assetUrl) return;

          let asset;
          try { asset = new URL(assetUrl, window.location.href); } catch { return; }
          // Only our own hashed, first-party application assets qualify.
          // Never send OAuth state or private engine data to another origin.
          if (asset.origin !== window.location.origin ||
              !/^\/assets\/[^/]+\.(?:js|css)$/.test(asset.pathname)) return;

          recoveryStarted = true;
          const current = new URL(window.location.href);
          if (current.searchParams.has(retryKey)) {
            const root = document.getElementById("root");
            if (root) root.textContent =
              "The J. Fortitude application could not load. Please refresh this page.";
            return; // No infinite refresh loop when the current deploy is broken.
          }
          current.searchParams.set(retryKey, String(Date.now()));
          window.location.replace(current.toString()); // Bust stale Pages HTML cache.
        }, true);

        window.addEventListener("load", () => {
          if (recoveryStarted) return;
          const current = new URL(window.location.href);
          if (!current.searchParams.has(retryKey)) return;
          current.searchParams.delete(retryKey);
          window.history.replaceState(window.history.state, "",
            current.pathname + current.search + current.hash);
        });
      })();
    </script>
